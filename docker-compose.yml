services:
  moteur:
    build: .
    image: zanalyze-engine:latest
    container_name: zanalyze-engine
    ports:
      - "8001:8001"
    environment:
      ENGINE_TOKEN: ${ENGINE_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped

  worker:
    image: zanalyze-engine:latest
    container_name: zanalyze-engine-worker
    command: ["sh", "/app/deploy/worker-loop.sh"]
    environment:
      ENGINE_WORKER_INTERVAL: ${ENGINE_WORKER_INTERVAL:-7200}
      ENGINE_JOURS_SNAPSHOT: ${ENGINE_JOURS_SNAPSHOT:-21}
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped
    depends_on:
      - moteur
    profiles: ["worker"]
