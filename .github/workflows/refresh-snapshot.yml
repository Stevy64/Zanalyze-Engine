# Refresh du snapshot matchs (contrat v1 pour la PWA Zanalyze).
#
# Source par défaut : ESPN (JSON public) — fonctionne sur les IP GitHub Actions.
# SofaScore reste disponible en local : ENGINE_PROVIDER=sofascore

name: Refresh snapshot

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_PROVIDER: espn

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore SQLite cache
        uses: actions/cache@v5
        with:
          path: data/engine.sqlite3
          key: engine-sqlite-${{ github.run_id }}
          restore-keys: |
            engine-sqlite-

      - name: Sync ESPN + analyse + snapshot
        id: refresh
        run: |
          set -euo pipefail
          python -m engine refresh --provider espn --jours 21 | tee refresh-out.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          raw = Path('refresh-out.json').read_text(encoding='utf-8')
          data = json.loads(raw[raw.find('{'):])
          sync = data.get('sync') or {}
          n = int(sync.get('crees_ou_maj') or 0)
          err = int(sync.get('erreurs') or 0)
          cotes = int(sync.get('avec_cotes_1x2') or 0)
          snap = json.loads(Path('exports/matchs.json').read_text(encoding='utf-8'))
          n_matchs = len(snap.get('matchs') or [])
          print(f"provider={sync.get('provider')} crees={n} cotes_1x2={cotes} erreurs={err} snapshot={n_matchs}")
          if n_matchs == 0:
              print('::error::Snapshot vide après sync ESPN.', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "zanalyze-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/matchs.json
          if git diff --cached --quiet; then
            echo "Pas de changement snapshot"
            exit 0
          fi
          git commit -m "chore: refresh match snapshot (espn)"
          # Evite le rejet si main a avancé pendant le job (push manuel / run parallèle).
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejeté (tentative $i) — rebase sur origin/main…"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Impossible de pousser le snapshot après 3 tentatives."
          exit 1
