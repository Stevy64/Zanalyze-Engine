# Refresh du snapshot matchs (contrat v1 pour la PWA Zanalyze).
#
# Source : ESPN (JSON public) — fonctionne sur les IP GitHub Actions.
# ~12 runs/jour × ~1 min ≈ 360 min/mois (OK free privé ; illimité si repo public).

name: Refresh snapshot

on:
  schedule:
    # Toutes les 2 h (UTC). Évite le pic :xx:00 des crons GitHub.
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: true

env:
  ENGINE_PROVIDER: espn

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Jobs réels ~30–90 s ; plafond bas pour rester loin des quotas free.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore SQLite cache
        uses: actions/cache@v5
        with:
          path: data/engine.sqlite3
          # Clé journalière : réutilise le cache entre runs (évite resync total).
          key: engine-sqlite-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            engine-sqlite-${{ runner.os }}-${{ github.ref_name }}-
            engine-sqlite-

      - name: Sync ESPN + analyse + snapshot
        id: refresh
        run: |
          set -euo pipefail
          python -m engine refresh --provider espn --jours 21 | tee refresh-out.json
          python - <<'PY'
          import json, sys
          from collections import Counter
          from pathlib import Path
          raw = Path('refresh-out.json').read_text(encoding='utf-8')
          data = json.loads(raw[raw.find('{'):])
          sync = data.get('sync') or {}
          n = int(sync.get('crees_ou_maj') or 0)
          err = int(sync.get('erreurs') or 0)
          cotes = int(sync.get('avec_cotes_1x2') or 0)
          snap = json.loads(Path('exports/matchs.json').read_text(encoding='utf-8'))
          matchs = snap.get('matchs') or []
          n_matchs = len(matchs)
          codes = Counter(m.get('competition_code') for m in matchs)
          n_termine = sum(1 for m in matchs if m.get('statut') == 'termine')
          print(
              f"provider={sync.get('provider')} crees={n} cotes_1x2={cotes} "
              f"erreurs={err} snapshot={n_matchs} termine={n_termine} "
              f"UCL={codes.get('UCL', 0)} UEL={codes.get('UEL', 0)}"
          )
          if n_matchs == 0:
              print('::error::Snapshot vide après sync ESPN.', file=sys.stderr)
              sys.exit(1)
          # Garde-fou : UEL doit rester dans le calendrier (sinon régression code).
          if codes.get('UEL', 0) == 0:
              print(
                  '::warning::Aucune UEL dans le snapshot '
                  '(hors saison ou régression TOURNOIS).',
              )
          PY

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "zanalyze-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/matchs.json
          if git diff --cached --quiet; then
            echo "Pas de changement snapshot"
            exit 0
          fi
          git commit -m "chore: refresh match snapshot (espn)"
          # Evite le rejet si main a avancé pendant le job (push manuel / run parallèle).
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejeté (tentative $i) — rebase sur origin/main…"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Impossible de pousser le snapshot après 3 tentatives."
          exit 1
