# Refresh du snapshot matchs (contrat v1 pour la PWA Zanalyze).
#
# SofaScore bloque souvent les IP GitHub Actions (sync → 0 matchs).
# Dans ce cas le job ÉCHOUE et ne pousse PAS un JSON vide.
# Contournement : refresh en local / Oracle → push exports/matchs.json
#   docs/oracle.md · docs/actions.md

name: Refresh snapshot

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore SQLite cache
        uses: actions/cache@v5
        with:
          path: data/engine.sqlite3
          key: engine-sqlite-${{ github.run_id }}
          restore-keys: |
            engine-sqlite-

      - name: Sync + analyse + snapshot
        id: refresh
        run: |
          set -euo pipefail
          python -m engine refresh --pages 1 --passes 1 --jours 21 | tee refresh-out.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          raw = Path('refresh-out.json').read_text(encoding='utf-8')
          # refresh prints a single JSON object (possibly pretty-printed)
          data = json.loads(raw[raw.find('{'):])
          sync = data.get('sync') or {}
          n = int(sync.get('crees_ou_maj') or 0)
          err = int(sync.get('erreurs') or 0)
          snap = json.loads(Path('exports/matchs.json').read_text(encoding='utf-8'))
          n_matchs = len(snap.get('matchs') or [])
          print(f"sync crees_ou_maj={n} erreurs={err} snapshot_matchs={n_matchs}")
          if n_matchs == 0:
              print(
                  '::error::Snapshot vide — SofaScore inaccessible depuis GitHub Actions. '
                  'Lance `python -m engine refresh` en local (ou Oracle) puis push exports/matchs.json. '
                  'Voir docs/oracle.md',
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Commit snapshot
        run: |
          git config user.name "zanalyze-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/matchs.json
          if git diff --cached --quiet; then
            echo "Pas de changement snapshot"
          else
            git commit -m "chore: refresh match snapshot"
            git push
          fi
