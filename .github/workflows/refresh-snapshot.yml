# Cycle complet du moteur : ingestion, analyse figée, règlement, archive,
# recalibration, snapshot. Source : ESPN (JSON public), joignable depuis les
# IP GitHub.
#
# Ce workflow commite trois choses, et c'est délibéré :
#   exports/matchs.json    ce que lit la PWA
#   data/archive/*.csv     la mémoire longue du moteur
#   data/calibration.json  ce qu'il a appris
# La base SQLite, elle, reste dans le cache : elle est reconstructible.

name: Refresh snapshot

on:
  schedule:
    # Toutes les 2 h (UTC), décalé du pic :00 des crons GitHub.
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      recalibrer:
        description: "Lancer la recalibration (publie seulement si elle gagne)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # La base est un cache de travail : sa perte ne coûte que du temps,
      # puisque l'archive et la calibration vivent dans le dépôt.
      - name: Restore SQLite cache
        uses: actions/cache@v5
        with:
          path: data/engine.sqlite3
          key: engine-sqlite-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            engine-sqlite-${{ runner.os }}-

      - name: Cycle complet
        id: refresh
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.recalibrer }}" = "false" ]; then
            EXTRA+=(--sans-calibration)
          fi
          python -m engine refresh --jours 21 "${EXTRA[@]}" | tee refresh-out.json
          python - <<'PY'
          import json, sys
          from collections import Counter
          from pathlib import Path

          brut = Path('refresh-out.json').read_text(encoding='utf-8')
          data = json.loads(brut[brut.find('{'):])
          sync = data.get('sync') or {}
          qualite = sync.get('qualite') or {}
          ana = data.get('analyses') or {}
          calib = data.get('calibration') or {}

          snap = json.loads(Path('exports/matchs.json').read_text(encoding='utf-8'))
          matchs = snap.get('matchs') or []
          codes = Counter(m.get('competition_code') for m in matchs)

          print(
              f"ingérés={sync.get('crees_ou_maj')} "
              f"cotes_1x2={sync.get('avec_cotes_1x2')} "
              f"ligne_totaux={sync.get('avec_ligne_totaux')} "
              f"analysés={ana.get('analyses')} refusés={ana.get('refuses')} "
              f"réglés={data.get('options_reglees')} "
              f"snapshot={len(matchs)} écartés={qualite.get('matchs_ecartes')} "
              f"UCL={codes.get('UCL', 0)} PL={codes.get('PL', 0)}"
          )
          print(f"calibration : {calib.get('raison', 'non lancée')}")

          if not matchs:
              print('::error::Snapshot vide après ingestion ESPN.', file=sys.stderr)
              sys.exit(1)

          # Une rencontre ne doit jamais apparaître deux fois : c'est le
          # défaut que l'identité canonique est censée avoir supprimé.
          vus = Counter(
              (m['competition_code'], m['coup_denvoi'][:10],
               m['domicile_slug'], m['exterieur_slug'])
              for m in matchs
          )
          doublons = [k for k, n in vus.items() if n > 1]
          if doublons:
              print(f'::error::Doublons dans le snapshot : {doublons[:5]}', file=sys.stderr)
              sys.exit(1)

          # Un identifiant ESPN exporté comme sofascore_id ferait qu'un club
          # en écrase un autre côté PWA.
          ids = [e['sofascore_id'] for e in snap.get('equipes') or []
                 if e.get('sofascore_id')]
          if len(ids) != len(set(ids)):
              print('::error::Identifiants d’équipes en double.', file=sys.stderr)
              sys.exit(1)

          avec_cotes = sum(1 for m in matchs if m.get('cotes'))
          if avec_cotes and sync.get('avec_cotes_1x2'):
              sans_ligne = sum(
                  1 for m in matchs
                  if m.get('statut') == 'a_venir' and m.get('cotes')
                  and m.get('ligne_totaux') is None
              )
              if sans_ligne:
                  print(f'::warning::{sans_ligne} match(s) à venir sans ligne de totaux.')

          if codes.get('UEL', 0) == 0:
              print('::warning::Aucune Ligue Europa au calendrier (hors saison ?).')
          PY

      - name: Commit snapshot, archive et calibration
        run: |
          set -euo pipefail
          git config user.name "zanalyze-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/matchs.json data/archive data/calibration.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à publier"
            exit 0
          fi
          git commit -m "chore: refresh snapshot, archive et calibration"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejeté (tentative $i) — rebase sur origin/main…"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Impossible de pousser après 3 tentatives."
          exit 1
